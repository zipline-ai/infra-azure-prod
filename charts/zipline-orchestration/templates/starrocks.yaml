# StarRocks deployment for querying Iceberg tables via JDBC catalog
  # Combines FE (frontend) and BE (backend) in a single pod
  # Requires StarRocks >= 3.5.12 for JDBC Iceberg catalog support
{{- $dbHostParts := splitList ":" .Values.database.orchestration.fqdn }}
{{- $dbHost := index $dbHostParts 0 }}
{{- $dbPort := "5432" }}
{{- if gt (len $dbHostParts) 1 }}
{{- $dbPort = index $dbHostParts 1 }}
{{- end }}
---
{{- if .Values.starrocks.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: starrocks-config
  namespace: {{ .Release.Namespace }}
data:
  fe.conf: |
    # StarRocks FE configuration
    LOG_DIR = ${STARROCKS_HOME}/log
    DATE = "$(date +%Y%m%d-%H%M%S)"
    JAVA_OPTS="-Dlog4j2.formatMsgNoLookups=true -Xmx4096m -XX:+UseG1GC -Xlog:gc*:${LOG_DIR}/fe.gc.log.$DATE:time"
    http_port = 8030
    rpc_port = 9020
    query_port = 9030
    edit_log_port = 9010
    meta_dir = ${STARROCKS_HOME}/fe/meta
    mysql_service_nio_enabled = true
    sys_log_level = INFO
    tablet_create_timeout_second = 60
    # Enable external catalog
    enable_experimental_mv = true
  be.conf: |
    # StarRocks BE configuration
    LOG_DIR = ${STARROCKS_HOME}/log
    sys_log_level = INFO
    be_port = 9060
    webserver_port = 8040
    heartbeat_service_port = 9050
    brpc_port = 8060
    # Storage configuration
    storage_root_path = ${STARROCKS_HOME}/be/storage
    mem_limit = 70%
{{- if .Values.starrocks.catalogInit.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: starrocks-catalog-sql
  namespace: {{ .Release.Namespace }}
data:
{{- range $path, $_ := .Files.Glob "catalogs/*.sql" }}
  {{ base $path }}: |-
{{ $.Files.Get $path | nindent 4 }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: starrocks-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: starrocks-jdbc-drivers
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: starrocks
  namespace: {{ .Release.Namespace }}
  labels:
    app: starrocks
spec:
  replicas: 1
  selector:
    matchLabels:
      app: starrocks
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: starrocks
      annotations:
        starrocks.zipline.ai/release-revision: {{ .Release.Revision | quote }}
    spec:
      serviceAccountName: orchestration-sa
      initContainers:
        # Download PostgreSQL JDBC driver (cached in PVC across restarts)
        - name: download-jdbc-driver
          image: {{ .Values.starrocks.utilityImage | quote }}
          command:
            - bash
            - -c
            - |
              if [ -f /jdbc-drivers/postgresql-42.7.4.jar ]; then
                echo "JDBC driver already cached, skipping download"
              else
                echo "Downloading PostgreSQL JDBC driver..."
                curl -fsSL --connect-timeout 30 -o /jdbc-drivers/postgresql-42.7.4.jar \
                  "https://jdbc.postgresql.org/download/postgresql-42.7.4.jar"
                echo "JDBC driver downloaded successfully"
              fi
              ls -la /jdbc-drivers/
          volumeMounts:
            - name: jdbc-drivers
              mountPath: /jdbc-drivers
      containers:
        # Combined FE + BE container using StarRocks allin1 image
        - name: starrocks
          image: {{ .Values.starrocks.image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9030
              name: mysql
            - containerPort: 8030
              name: fe-http
            - containerPort: 8040
              name: be-http
          env:
            - name: STARROCKS_HOME
              value: /opt/starrocks
          volumeMounts:
            - name: data
              mountPath: /opt/starrocks/fe/meta
              subPath: fe-meta
            - name: data
              mountPath: /opt/starrocks/be/storage
              subPath: be-storage
            - name: jdbc-drivers
              mountPath: /opt/starrocks/fe/lib/postgresql-42.7.4.jar
              subPath: postgresql-42.7.4.jar
            - name: jdbc-drivers
              mountPath: /opt/starrocks/be/lib/jni-packages/postgresql-42.7.4.jar
              subPath: postgresql-42.7.4.jar
            - name: config
              mountPath: /opt/starrocks/fe/conf/fe.conf
              subPath: fe.conf
            - name: config
              mountPath: /opt/starrocks/be/conf/be.conf
              subPath: be.conf
          resources:
            requests:
              memory: "2Gi"
              cpu: "1000m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
          startupProbe:
            tcpSocket:
              port: 9030
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 9030
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 9030
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: starrocks-data
        - name: jdbc-drivers
          persistentVolumeClaim:
            claimName: starrocks-jdbc-drivers
        - name: config
          configMap:
            name: starrocks-config
---
apiVersion: v1
kind: Service
metadata:
  name: starrocks-service
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: starrocks
  ports:
    - name: mysql
      port: 9030
      targetPort: 9030
    - name: fe-http
      port: 8030
      targetPort: 8030
    - name: be-http
      port: 8040
      targetPort: 8040
---
# NodePort service for local access
apiVersion: v1
kind: Service
metadata:
  name: starrocks-nodeport
  namespace: {{ .Release.Namespace }}
spec:
  type: NodePort
  selector:
    app: starrocks
  ports:
    - name: mysql
      port: 9030
      targetPort: 9030
      nodePort: 30930
    - name: fe-http
      port: 8030
      targetPort: 8030
      nodePort: 30830
{{- if .Values.starrocks.catalogInit.enabled }}
---
# Job to initialize the Iceberg catalog after StarRocks is ready
apiVersion: batch/v1
kind: Job
metadata:
  name: starrocks-init-catalog
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
    "helm.sh/hook-weight": "10"
spec:
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      serviceAccountName: orchestration-sa
      restartPolicy: OnFailure
      initContainers:
        # Wait for StarRocks to actually accept queries (not just TCP)
        - name: wait-for-starrocks
          image: {{ .Values.starrocks.mysqlImage | quote }}
          command:
            - sh
            - -c
            - |
              echo "Waiting for StarRocks to accept queries..."
              for i in $(seq 1 60); do
                if mysql -h starrocks-service -P 9030 -u root -e "SELECT 1" >/dev/null 2>&1; then
                  echo "StarRocks is ready and accepting queries"
                  exit 0
                fi
                echo "Attempt $i/60: StarRocks not ready, waiting..."
                sleep 3
              done
              echo "Timeout waiting for StarRocks"
              exit 1
        # Wait for PostgreSQL (Iceberg catalog backend)
        - name: wait-for-postgres
          image: {{ .Values.starrocks.utilityImage | quote }}
          command:
            - bash
            - -c
            - |
              echo "Waiting for PostgreSQL..."
              for i in $(seq 1 30); do
                if timeout 5 bash -c '</dev/tcp/{{ $dbHost }}/{{ $dbPort }}' 2>/dev/null; then
                  echo "PostgreSQL is ready"
                  exit 0
                fi
                sleep 2
              done
              exit 1
      containers:
        - name: init-catalog
          image: {{ .Values.starrocks.mysqlImage | quote }}
          env:
            - name: AZURE_STORAGE_ACCOUNT_NAME
              value: {{ .Values.azure.storage_account_name | quote }}
            - name: AZURE_STORAGE_ACCOUNT_KEY
              value: {{ .Values.azure.storage_account_key | quote }}
            - name: AZURE_TENANT_ID
              value: {{ .Values.azure.tenant_id | quote }}
            - name: AZURE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: azure-sp-credentials
                  key: azure-sp-client-id
            - name: AZURE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: azure-sp-credentials
                  key: azure-sp-client-secret
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
            - name: SKIP_MISSING_REQUIRED_ENV
              value: {{ .Values.starrocks.catalogInit.skipMissingRequiredEnv | quote }}
            - name: CATALOG_DATABRICKS_UNITY_ENABLED
              value: {{ .Values.starrocks.catalogInit.catalogs.databricksUnity | quote }}
            - name: CATALOG_SNOWFLAKE_POLARIS_ENABLED
              value: {{ .Values.starrocks.catalogInit.catalogs.snowflakePolaris | quote }}
            {{- range $name, $value := .Values.starrocks.catalogInit.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            - name: DATABRICKS_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: databricks-sp-credentials
                  key: databricks-client-id
            - name: DATABRICKS_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: databricks-sp-credentials
                  key: databricks-client-secret
            - name: SNOWFLAKE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: snowflake-polaris-credentials
                  key: snowflake-polaris-client-id
            - name: SNOWFLAKE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: snowflake-polaris-credentials
                  key: snowflake-polaris-client-secret
            - name: SNOWFLAKE_ACCOUNT
              value: {{ .Values.starrocks.catalogInit.env.SNOWFLAKE_ACCOUNT | quote }}
            - name: POLARIS_WAREHOUSE
              value: {{ .Values.starrocks.catalogInit.env.POLARIS_WAREHOUSE | quote }}
            - name: POLARIS_PRINCIPAL_ROLE
              value: {{ .Values.starrocks.catalogInit.env.POLARIS_PRINCIPAL_ROLE | quote }}
          command:
            - sh
            - -c
            - |
              echo "Creating Iceberg external catalog in StarRocks..."

              sql_escape() {
                printf '%s' "$1" | sed 's/\\/\\\\/g; s/"/\\"/g'
              }

              sed_escape_replacement() {
                sed -e 's/\\/\\\\/g' -e 's/[\/&]/\\&/g'
              }

              catalog_enabled() {
                case "$1" in
                  databricks-unity.sql)
                    [ "${CATALOG_DATABRICKS_UNITY_ENABLED:-true}" = "true" ]
                    ;;
                  snowflake-polaris.sql)
                    [ "${CATALOG_SNOWFLAKE_POLARIS_ENABLED:-true}" = "true" ]
                    ;;
                  *)
                    true
                    ;;
                esac
              }

              render_sql_template() {
                input_file="$1"
                output_file="$2"

                cp "$input_file" "$output_file"
                vars="$(grep -o '\${[A-Za-z_][A-Za-z0-9_]*}' "$input_file" | sed 's/[${}]//g' | sort -u)"
                for var in $vars; do
                  eval "raw_value=\${$var:-}"
                  escaped_value="$(sql_escape "$raw_value" | sed_escape_replacement)"
                  sed -i "s/\${$var}/$escaped_value/g" "$output_file"
                done
              }

              apply_catalog_template() {
                catalog_file="$1"
                catalog_name="$(basename "$catalog_file")"
                requires="$(sed -n 's/^-- @requires:[[:space:]]*//p' "$catalog_file" | head -n1)"
                missing=""

                if ! catalog_enabled "$catalog_name"; then
                  echo "Skipping $catalog_name; disabled by Helm values"
                  return 0
                fi

                for var in $requires; do
                  eval "value=\${$var:-}"
                  if [ -z "$value" ]; then
                    missing="$missing $var"
                  fi
                done

                if [ -n "$missing" ]; then
                  if [ "$SKIP_MISSING_REQUIRED_ENV" = "true" ]; then
                    echo "Skipping $catalog_name; missing required env:$missing"
                    return 0
                  fi

                  echo "Cannot apply $catalog_name; missing required env:$missing"
                  return 1
                fi

                rendered="/tmp/rendered-$catalog_name"
                render_sql_template "$catalog_file" "$rendered"

                echo "Applying $catalog_name..."
                mysql -h starrocks-service -P 9030 -u root < "$rendered"
              }

              DB_USERNAME_ESCAPED="$(sql_escape "$DB_USERNAME")"
              DB_PASSWORD_ESCAPED="$(sql_escape "$DB_PASSWORD")"
              AZURE_STORAGE_ACCOUNT_KEY_ESCAPED="$(sql_escape "$AZURE_STORAGE_ACCOUNT_KEY")"

              if [ -z "$DB_USERNAME_ESCAPED" ] || [ -z "$DB_PASSWORD_ESCAPED" ]; then
                echo "Database credentials are missing from db-credentials secret"
                exit 1
              fi

              cat > /tmp/init-catalog.sql <<EOF
              -- Create Iceberg external catalog pointing to the Azure PostgreSQL Flexible Server.
              DROP CATALOG IF EXISTS iceberg;
              CREATE EXTERNAL CATALOG iceberg
              PROPERTIES (
                  "type" = "iceberg",
                  "iceberg.catalog.type" = "jdbc",
                  "iceberg.catalog.uri" = "jdbc:postgresql://{{ $dbHost }}:{{ $dbPort }}/{{ .Values.database.orchestration.database }}?sslmode=require",
                  "driver_url" = "file:///opt/starrocks/fe/lib/postgresql-42.7.4.jar",
                  "driver_class" = "org.postgresql.Driver",
                  "iceberg.catalog.warehouse" = "abfss://{{ .Values.azure.warehouse_container_name }}@{{ .Values.azure.storage_account_name }}.dfs.core.windows.net/",
                  "iceberg.catalog.jdbc.user" = "${DB_USERNAME_ESCAPED}",
                  "iceberg.catalog.jdbc.password" = "${DB_PASSWORD_ESCAPED}",
                  "jdbc.user" = "${DB_USERNAME_ESCAPED}",
                  "jdbc.password" = "${DB_PASSWORD_ESCAPED}",
                  "iceberg.catalog.jdbc.init-catalog-tables" = "true",
                  "azure.adls2.storage_account" = "{{ .Values.azure.storage_account_name }}",
                  "azure.adls2.shared_key" = "${AZURE_STORAGE_ACCOUNT_KEY_ESCAPED}"
              );
              EOF

              mysql -h starrocks-service -P 9030 -u root < /tmp/init-catalog.sql

              for catalog_file in /catalogs/*.sql; do
                if [ -f "$catalog_file" ]; then
                  apply_catalog_template "$catalog_file"
                fi
              done

              # Verify catalog was created
              echo ""
              echo "Verifying catalog creation..."
              mysql -h starrocks-service -P 9030 -u root -e "SHOW CATALOGS;"

              echo ""
              echo "Iceberg catalog initialized successfully!"
              echo "You can now query Iceberg tables using: SET CATALOG iceberg;"
          volumeMounts:
            - name: secrets-store-inline
              mountPath: "/mnt/secrets-store"
              readOnly: true
            - name: catalog-sql
              mountPath: /catalogs
              readOnly: true
      volumes:
        - name: secrets-store-inline
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: "zipline-secret-provider"
        - name: catalog-sql
          configMap:
            name: starrocks-catalog-sql
{{- end }}
{{- end }}
